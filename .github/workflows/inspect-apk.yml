name: Inspect APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - apk-inspection-report.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate uploaded APK
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          : > archive-listing.txt
          for archive in ./*.zip; do
            [ -f "$archive" ] || continue
            echo "CONTENTS OF $archive" | tee -a archive-listing.txt
            unzip -l "$archive" | tee -a archive-listing.txt
            unzip -o "$archive" -d extracted
          done
          find . -maxdepth 4 -type f -printf '%p %s bytes\n' | tee -a archive-listing.txt
          apk="$(find extracted . -type f -iname '*.apk' -print -quit)"
          if [ -n "$apk" ]; then
            cp "$apk" input.apk
          elif [ -f extracted/AndroidManifest.xml ] && [ -f extracted/classes.dex ]; then
            echo "The ZIP files contain split APK contents; merging them into input.apk."
            (cd extracted && zip -qr ../input.apk .)
          else
            cp archive-listing.txt apk-inspection-report.txt
            echo "::error::The ZIP files do not contain an APK or a complete split APK."
            exit 1
          fi
          echo "APK_PATH=input.apk" >> "$GITHUB_ENV"

      - name: Install APKTool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar
          java -jar apktool.jar --version

      - name: Decode APK
        run: java -jar apktool.jar d -f "$APK_PATH" -o decoded

      - name: Build inspection report
        shell: bash
        run: |
          {
            cat archive-listing.txt
            echo "===== MANIFEST ACTIVITIES ====="
            grep -nE 'activity|MAIN|LAUNCHER' decoded/AndroidManifest.xml | head -120 || true
            echo "===== BACK HANDLING ====="
            grep -RniE 'onBackPressed|KEYCODE_BACK|finishAffinity|moveTaskToBack' decoded/smali* | head -240 || true
            echo "===== QUALITY / RESOLUTION ====="
            grep -RniE 'selectedQuality|QualityAdapter|HlsQuality|HIGHEST|video_quality|resolution' decoded/smali* decoded/res/values* | head -300 || true
          } > apk-inspection-report.txt

      - name: Publish inspection report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-inspection-report.txt
          git commit -m "Add APK inspection report" || exit 0
          git push

      - name: Upload decoded APK
        uses: actions/upload-artifact@v4
        with:
          name: decoded-apk
          path: decoded
          retention-days: 3

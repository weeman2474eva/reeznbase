name: Inspect APK

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - apk-inspection-report.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate uploaded APK
        shell: bash
        run: |
          set -e
          mkdir -p extracted
          : > archive-listing.txt
          for archive in ./*.zip; do
            [ -f "$archive" ] || continue
            echo "CONTENTS OF $archive" | tee -a archive-listing.txt
            unzip -l "$archive" | tee -a archive-listing.txt
            unzip -o "$archive" -d extracted
          done
          find . -maxdepth 4 -type f -printf '%p %s bytes\n' | tee -a archive-listing.txt
          apk="$(find extracted . -type f -iname '*.apk' -print -quit)"
          if [ -n "$apk" ]; then
            cp "$apk" input.apk
          elif [ -f extracted/AndroidManifest.xml ] && [ -f extracted/classes.dex ]; then
            echo "The ZIP files contain split APK contents; merging them into input.apk."
            (cd extracted && zip -qr ../input.apk .)
          else
            cp archive-listing.txt apk-inspection-report.txt
            echo "::error::The ZIP files do not contain an APK or a complete split APK."
            exit 1
          fi
          echo "APK_PATH=input.apk" >> "$GITHUB_ENV"

      - name: Install APKTool
        run: |
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -O apktool.jar
          java -jar apktool.jar --version

      - name: Decode APK
        run: java -jar apktool.jar d -f "$APK_PATH" -o decoded

      - name: Build inspection report
        shell: bash
        run: |
          {
            cat archive-listing.txt
            echo "===== MANIFEST ACTIVITIES ====="
            grep -nE 'activity|MAIN|LAUNCHER' decoded/AndroidManifest.xml | head -120 || true
            echo "===== BACK HANDLING ====="
            grep -RniE 'onBackPressed|KEYCODE_BACK|finishAffinity|moveTaskToBack' decoded/smali* | head -240 || true
            echo "===== QUALITY / RESOLUTION ====="
            grep -RniE 'selectedQuality|QualityAdapter|HlsQuality|HIGHEST|video_quality|resolution' decoded/smali* decoded/res/values* | head -300 || true
          } > apk-inspection-report.txt

      - name: Publish inspection report
        run: |
          mkdir -p inspection
          cp decoded/smali_classes2/com/rmedia/rplayer/activities/MainActivity.smali inspection/
          cp decoded/smali_classes2/com/rmedia/rplayer/features/landing/LandingActivity.smali inspection/
          cp decoded/smali_classes2/com/rmedia/rplayer/features/mainfragments/FragmentHome\$1.smali inspection/
          cp decoded/smali_classes2/com/rmedia/rplayer/features/mainfragments/FragmentHomeTV\$1.smali inspection/
          cp decoded/smali_classes2/com/rmedia/rplayer/features/player/PlayerPreferencesViewModel.smali inspection/
          cp decoded/smali_classes2/com/rmedia/rplayer/features/player/QualityAdapter.smali inspection/
          cp decoded/smali_classes2/com/rmedia/rplayer/features/player/ReeznPlayer.smali inspection/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apk-inspection-report.txt inspection
          git commit -m "Add APK inspection report" || exit 0
          git push

      - name: Patch back-to-exit and highest quality default
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          main = Path("decoded/smali_classes2/com/rmedia/rplayer/activities/MainActivity.smali")
          text = main.read_text()
          pattern = r"\.method public onBackPressed\(\)V.*?\.end method"
          replacement = """.method public onBackPressed()V
              .locals 0

              invoke-virtual {p0}, Landroid/app/Activity;->finishAffinity()V

              return-void
          .end method"""
          text, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit("MainActivity back method was not patched")
          main.write_text(text)

          player = Path("decoded/smali_classes2/com/rmedia/rplayer/features/player/ReeznPlayer.smali")
          text = player.read_text()
          start = text.index(".method private prepareQualityData()V")
          end = text.index(".end method", start)
          method = text[start:end]
          marker = """    :cond_9
              iget-object v1, p0, Lcom/rmedia/rplayer/features/player/ReeznPlayer;->prefsViewModel:Lcom/rmedia/rplayer/features/player/PlayerPreferencesViewModel;"""
          insert = """    :cond_9
              # Default to the final listed stream quality (highest available).
              invoke-virtual {v0}, Ljava/util/ArrayList;->size()I

              move-result v4

              add-int/lit8 v4, v4, -0x1

              if-gez v4, :quality_default_ready

              const/4 v4, 0x0

              :quality_default_ready
              iget-object v1, p0, Lcom/rmedia/rplayer/features/player/ReeznPlayer;->prefsViewModel:Lcom/rmedia/rplayer/features/player/PlayerPreferencesViewModel;"""
          if marker not in method:
              raise SystemExit("Quality selection point was not found")
          method = method.replace(marker, insert, 1)
          text = text[:start] + method + text[end:]
          player.write_text(text)
          PY

      - name: Rebuild and sign APK
        shell: bash
        run: |
          set -e
          java -jar apktool.jar b decoded -o reezn-fixed-unsigned.apk
          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$build_tools/zipalign" -f 4 reezn-fixed-unsigned.apk reezn-fixed-aligned.apk
          keytool -genkeypair -v -keystore reezn-build.jks -storepass reezn123 -keypass reezn123 -alias reezn -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Reezn Build, OU=Android, O=Reezn, L=NA, S=NA, C=GB"
          "$build_tools/apksigner" sign --ks reezn-build.jks --ks-pass pass:reezn123 --key-pass pass:reezn123 --out reezn-back-exit-highest-quality.apk reezn-fixed-aligned.apk
          "$build_tools/apksigner" verify --verbose reezn-back-exit-highest-quality.apk

      - name: Upload fixed APK
        uses: actions/upload-artifact@v4
        with:
          name: reezn-fixed-apk
          path: reezn-back-exit-highest-quality.apk
          retention-days: 7

      - name: Upload decoded APK
        uses: actions/upload-artifact@v4
        with:
          name: decoded-apk
          path: decoded
          retention-days: 3
